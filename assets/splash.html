<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WeighWiz - Loading</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #50350c;
    }
    img {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      object-fit: contain;
    }
    h1 {
      margin: 0;
      font-size: 28px;
    }
    .spinner {
      margin-top: 20px;
      width: 30px;
      height: 30px;
      border: 4px solid #eee;
      border-top: 4px solid #50350c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .footer {
      position: absolute;
      bottom: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
<img 
  src="./weighwiz.png" 
  alt="WeighWiz Logo" 
  style="width: 120px; height: auto; max-height: 120px;"
/>
  <h1>WeighWiz</h1>
  <div class="spinner"></div>
  <hr/>
  <p>WeighWiz is starting...</p>
  <div>Version 1.0.0</div>
  <div class="footer">Powered by Ayzeroxa Technologies</div>
</body>
</html>
